name: Weekly Model Retrain

on:
  schedule:
    - cron: "0 18 * * 0"      # Every Sunday 11:30 PM IST
  workflow_dispatch:            # manual "Run" button

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain models
        run: |
          python src/data_ingestion.py
          python src/features.py
          python src/train.py
          python src/save_forecasts.py

      - name: Commit updated models + forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/*_lgbm.pkl models/*_dir_clf.pkl models/daily_feature_cols.pkl models/monthly_feature_cols.pkl
          git add models/all_metrics.json models/backtest_*.csv models/metrics_*.json
          git add models/optuna/
          git add frontend/data/forecasts.json
          git diff --staged --quiet || git commit -m "Automated weekly model retrain [skip ci]"
          git push
